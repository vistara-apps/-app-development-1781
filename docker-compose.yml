version: '3.8'

services:
  flashtrade-sim:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_APP_NAME=FlashTrade Sim
      - VITE_APP_VERSION=1.0.0
      - VITE_ENVIRONMENT=production
      - VITE_DEMO_MODE=true
      - VITE_STARTING_BALANCE=10000
      - VITE_ENABLE_ANALYTICS=true
      - VITE_ENABLE_ADVANCED_TRADING=true
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - flashtrade-sim
    restart: unless-stopped
    profiles:
      - production

networks:
  default:
    name: flashtrade-network
